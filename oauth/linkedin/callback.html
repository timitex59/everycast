<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Everycast — retour de connexion</title>
  <style>
    :root { color-scheme: light dark; }
    body { margin: 0; font: 17px/1.6 system-ui, "Segoe UI", sans-serif; background: #fafaf9; color: #1c1917; }
    @media (prefers-color-scheme: dark) { body { background: #1c1917; color: #f5f5f4; } }
    main { max-width: 560px; margin: 0 auto; padding: 48px 16px; }
  </style>
</head>
<body>
<main>
  <h1>Retour vers Everycast…</h1>
  <p>Cette page transmet l'autorisation à l'application Everycast ouverte sur votre ordinateur. Rien n'est conservé ici.</p>
  <p id="fallback" hidden>Si rien ne se passe, vérifiez qu'Everycast est ouvert, puis relancez la connexion depuis l'application.</p>
</main>
<script>
  // Relais local : La plateforme exige une adresse HTTPS ; le code part immédiatement
  // vers l'écouteur d'Everycast sur cet ordinateur (127.0.0.1).
  var target = 'http://127.0.0.1:43821/oauth/linkedin/callback' + window.location.search;
  window.location.replace(target);
  setTimeout(function () { document.getElementById('fallback').hidden = false; }, 4000);
</script>
</body>
</html>
